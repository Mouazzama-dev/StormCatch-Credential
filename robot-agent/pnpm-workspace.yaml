# robot-agent is its own workspace, independent of the parent repo

strictDepBuilds: false
verifyDepsBeforeRun: false

onlyBuiltDependencies:
  - '@openwallet-foundation/askar-nodejs'
  - cbor-extract
  - esbuild
  - koffi

allowBuilds:
  '@openwallet-foundation/askar-nodejs': set this to true or false
  '@scarf/scarf': set this to true or false
  cbor-extract: set this to true or false
  esbuild: set this to true or false
  koffi: set this to true or false
