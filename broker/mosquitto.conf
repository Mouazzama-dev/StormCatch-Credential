# Payload revocation broker (src/payload/revocation.ts). Every client logs in; the ACL below decides who may publish what. Persistence keeps the retained revoked/<jti> messages across a broker restart.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwords
acl_file /mosquitto/data/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
